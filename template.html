<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Reef</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04141d">
<style>
/* The class on <body> is the page state: l loading, m menu, g in the scene (g p with the mouse captured), l e failed */
html { background: #04141d; }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; background: radial-gradient(#0c3c50, #04141d 70%);
  font: 600 clamp(13px, .7vw + .9vh, 30px)/1.4 system-ui, sans-serif; color: #e9fbff;
  -webkit-user-select: none; user-select: none;
}
canvas { position: absolute; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: filter 1s, transform 1s, opacity 2s; }
body:not(.g) canvas { filter: blur(.9vmax) brightness(.55); transform: scale(1.06); }
.l canvas { opacity: 0; }
#m {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: min(2em, 5vmin);
  padding: 1em; text-align: center; background: radial-gradient(#04141d00 30%, #04141dcc); transition: opacity .5s, visibility .5s;
}
.g #m, .m #l, .l #g { opacity: 0; visibility: hidden; }
h1 {
  margin: 0; font: 200 4.2em/1 system-ui, sans-serif; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase;
  color: #0000; background: linear-gradient(#fff 20%, #9ff3ff 60%, #35b6cf); -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 .05em .25em #000c);
}
h2 { margin: -.9em 0 0; font: 500 .78em/1 system-ui, sans-serif; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; opacity: .7; }
p { margin: 0; }
#a { display: grid; width: 30em; max-width: 100%; }
#a > * { grid-area: 1/1; transition: opacity .8s, visibility .8s; }
#s, #q, #k, #t { font-size: .78em; letter-spacing: .12em; text-transform: uppercase; }
#p { height: .4em; margin: .4em 0 1em; overflow: hidden; border-radius: 1em; background: #04141d; box-shadow: 0 0 0 1px #9ff3ff80, 0 0 1.5em #1aa7c2; }
#b { display: block; height: 100%; background: linear-gradient(90deg, #1aa7c2, #b4f8ff); transform: scaleX(0); transform-origin: 0; will-change: transform; }
.e #p { visibility: hidden; }
.e #s { font-size: 1.05em; letter-spacing: 0; text-transform: none; }
button {
  display: flex; align-items: center; justify-content: center; padding: .8em 1.4em; border: 0; border-radius: 3em;
  font: 700 1em/1.2 system-ui, sans-serif; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; color: #05242f; cursor: pointer;
  transition: transform .12s, filter .12s;
}
button:hover { transform: translateY(-.1em); filter: brightness(1.12); }
button:active { transform: translateY(.08em); filter: brightness(.92); }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
#g { display: grid; gap: min(1.1em, 3vmin); }
#d { padding: .95em; background: linear-gradient(#b4f8ff, #2cc4d8); font-size: 1.2em; box-shadow: 0 0 2.4em #2cc4d899; }
#q, #k, #t { padding: .9em 1.5em; border-radius: .9em; background: #04141db3; }
#q { display: flex; align-items: center; gap: .4em; padding: .4em; }
#q span { flex: 1; color: #9ff3ff; }
#q button { flex: 1.2; padding: .6em 0; background: none; color: #e9fbff; letter-spacing: .12em; text-indent: .12em; font-weight: 600; }
#q button:hover { background: #9ff3ff2e; }
#q .on { background: linear-gradient(#b4f8ff, #2cc4d8); color: #05242f; pointer-events: none; }
#k { display: flex; justify-content: center; gap: 2em; text-align: left; }
#k p { display: grid; grid-template-columns: auto auto; align-content: start; align-items: center; gap: .5em .9em; }
#k p + p { padding-left: 2em; border-left: 1px solid #9ff3ff40; }
#k i { display: flex; justify-self: end; align-items: center; gap: .25em; font-style: normal; }
#k b { min-width: 1.1em; padding: .15em .5em; border-radius: .35em; background: #e9fbff; color: #05242f; text-align: center; }
#t { display: none; }
@media (pointer: coarse), (max-height: 34em) { #k { display: none; } }
@media (pointer: coarse) { #t { display: block; } }
#o { position: absolute; top: .6em; right: .6em; display: none; padding: .3em .7em; background: #05242fd9; box-shadow: inset 0 0 0 1px #9ff3ff; color: #e9fbff; opacity: .8; letter-spacing: 0; text-indent: 0; }
.g #o { display: flex; }
.p #o { display: none; }
#i { position: absolute; top: 1em; left: 1.2em; margin: 0; font: .72em/1.6 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none; }
/* place name shown for a moment after jumping to a viewpoint */
#n { position: absolute; left: 0; right: 0; top: 38%; text-align: center; opacity: 0; transition: opacity 1s; pointer-events: none; text-shadow: 0 2px 18px #012; }
#n b { display: block; font: 200 2.6em/1 system-ui, sans-serif; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; }
#n span { display: block; margin-top: 1em; font-size: .72em; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; opacity: .75; }
#n.on { opacity: 1; }
</style>
</head>
<body class="l">
<canvas id="c"></canvas>
<div id="n"><b></b><span></span></div>
<div id="m">
  <h1>Lantern Reef</h1>
  <h2>A procedural sea: reef, lagoon and harbor town</h2>
  <div id="a">
    <div id="l"><div id="p"><i id="b"></i></div><p id="s">Preparing&hellip;</p></div>
    <div id="g">
      <button id="d">Dive in</button>
      <p id="q"><span>Detail</span><button>Low</button><button>Medium</button><button>High</button></p>
      <div id="k">
        <p>
          <i><b>W</b><b>A</b><b>S</b><b>D</b></i>Swim / fly
          <i><b>Q</b><b>E</b></i>Down / up
          <i><b>Shift</b></i>Faster
          <i><b>1</b>&ndash;<b>0</b></i>Viewpoints
        </p>
        <p>
          <i><b>Esc</b></i>Menu
          <i><b>M</b></i>Mute
          <i><b>H</b></i>Stats
        </p>
      </div>
      <p id="t">Hold to swim forward &middot; slide to steer &middot; second finger to go faster</p>
    </div>
  </div>
</div>
<button id="o" aria-label="Menu">&equiv;</button>
<pre id="i"></pre>
<script>
/*SCRIPT*/
</script>
</body>
</html>
